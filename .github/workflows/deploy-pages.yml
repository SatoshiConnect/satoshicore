name: Build, test and deploy static site to GitHub Pages

# SatoshiCore Web Platform v24.0
#
# NOTE ON ACTIVATION (updated 2026-10-31):
# The deploy job is gated on `main` pushes OR explicit workflow_dispatch runs.
# Pages Source is GitHub Actions (migrated from the legacy gh-pages branch);
# the production custom domain is wallet.satoshicore.org (DNS verified:
# wallet.satoshicore.org -> satoshiconnect.github.io). Build and test jobs
# run on every push/PR regardless; feature-branch deploys require a deliberate
# workflow_dispatch call — they are never automatic.

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      custom_domain:
        description: "Build for the custom domain root (satoshicore.org). Set false only for a github.io subpath preview build."
        type: boolean
        default: true
      custom_domain_name:
        description: "Hostname written to out/CNAME when custom_domain=true. Must match the custom domain configured in Settings → Pages."
        type: string
        default: satoshicore.org

permissions:
  contents: read
  # pages: write and id-token: write are required for deployment; they are
  # scoped to the deploy job, which is currently disabled.
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  gateway:
    name: Test API Gateway service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run gateway tests (unit + mock-core integration)
        working-directory: services/api-gateway
        run: npm test

  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          # The production origin satoshicore.org serves the site at its root,
          # and the live HTML proves the base path must be empty — its script
          # tags are /_next/... . Main-branch deploys and custom_domain=true
          # dispatch builds are therefore root-relative; only an explicit
          # github.io preview (dispatch with custom_domain=false) uses the
          # /satoshicore project subpath, and that build must not be published
          # to the custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.custom_domain == false && '/satoshicore' || '' }}
          # Production gateway: the owner-operated HTTPS gateway in front of
          # the Mainnet node. The exact browser origin is allowlisted there.
          # The gateway allowlists exact browser origins — add this origin to
          # its ALLOWED_ORIGINS when changing the deploy domain.
          NEXT_PUBLIC_API_GATEWAY_URL: https://gateway.satoshicore.org
          # The explorer reads transaction history from the indexer, which sits
          # behind the same gateway origin (routes /v1/* there).
          NEXT_PUBLIC_INDEXER_URL: https://gateway.satoshicore.org
          # Byte-exact Mainnet identity required before any signing UI unlocks.
          NEXT_PUBLIC_NSAT_NETWORK_ID: NSAT Mainnet ; October 2026 ; bc3098829fffc717
        run: npm run build

      - name: Apply custom-domain configuration
        if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.custom_domain == true)
        env:
          # Explicit hostname, so a deploy to satoshicore.org never silently
          # ships the wallet.satoshicore.org value that CNAME.reference holds.
          # A push to main has no dispatch inputs, so the input falls back to
          # the production hostname instead of writing an empty CNAME.
          CUSTOM_DOMAIN: ${{ inputs.custom_domain_name || 'satoshicore.org' }}
        run: |
          set -e
          test -n "$CUSTOM_DOMAIN"
          printf '%s\n' "$CUSTOM_DOMAIN" > out/CNAME
          echo "out/CNAME -> $CUSTOM_DOMAIN"

      - name: Verify root asset paths for the production domain
        if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.custom_domain == true)
        run: |
          grep -q 'src="/_next/' out/index.html
          ! grep -q 'src="/satoshicore/_next/' out/index.html

      - name: Run static-export verification tests
        run: npm test

      # Theme contract, named explicitly so a failure is readable in the UI.
      # Pure Node (no browser): the palette must stay AA in both themes, the
      # wallet copy of the palette may not drift, and no new colour literal may
      # appear outside a token block. The browser-deep audit stays manual:
      #   node scripts/theme-audit.mjs --base <origin>
      - name: Theme contract (contrast tokens + CSS hex ratchet)
        run: |
          node --test tests/theme-contrast.test.mjs
          node scripts/check-css-hex.mjs

      # Mainnet identity regression: the built artifact must carry the EXACT
      # full passphrase. A missing string means the strict-identity client
      # was not included in the build. If the Mainnet identity ever changes
      # via an authorized protocol upgrade, update BOTH this check and
      # FULL_MAINNET_IDENTITY in lib/nsatClient.js in the same commit.
      - name: Mainnet identity regression (exact passphrase in artifact)
        run: |
          set -e
          count=$(grep -rl 'NSAT Mainnet ; October 2026 ; bc3098829fffc717' out/_next/static/chunks | wc -l | tr -d ' ')
          echo "full-identity chunks: $count"
          test "$count" -ge 1
          if grep -q '"NSAT"' out/_next/static/chunks/*.js; then
            echo 'dev tooling may legitimately contain the short token; checking it is not used as network fallback…'
          fi

      - name: Security scan of static output
        run: node tests/security-scan.mjs out

      # Dependency audit: WARNING-level visibility. It does not gate this
      # build (Next.js 14.2.15 carries known advisories until the pin is
      # upgraded — tracked in WEB-WALLET-SECURITY-REVIEW.md), but failures are
      # surfaced on every run so they cannot be missed.
      - name: Dependency audit (advisory)
        run: npm audit --omit=dev --audit-level=high || echo '::warning::npm audit reported vulnerabilities (see log) — tracked in WEB-WALLET-SECURITY-REVIEW.md'

      - name: Upload static output
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages (owner-gated)
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    # Owner-approved gate (2026-10-31): automatic on main; feature branches
    # deploy ONLY via explicit workflow_dispatch. Enable Enforce HTTPS when
    # the domain certificate is issued (see docs/DEPLOYMENT.md).
    if: github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.custom_domain == true)
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify the deployed site
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Evidence, not optimism: fetch the URLs GitHub Pages actually serves and
      # fail the run when the live artifact is not the build we just produced
      # (missing web app manifest, old landing page, wrong content type).
      # Advisory lines cover the gateway origin allowlist, which the owner
      # manages separately and which must never fail a site deploy.
      - name: Verify deployed URLs
        run: node scripts/verify-deployed-site.mjs "${{ needs.deploy.outputs.page_url }}"

      - name: Write verification summary
        if: always()
        run: |
          {
            echo "### Deployed site verification"
            echo ""
            echo "- URL: ${{ needs.deploy.outputs.page_url }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — NSAT Wallet</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #050a14; color: #e8eefc; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: grid; place-items: center; padding: 24px; text-align: center;
    }
    .card { max-width: 28rem; border: 1px solid rgba(148, 163, 184, .25); border-radius: 18px; padding: 28px; background: #08111f; }
    .mark { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; border: 3px solid #f0b90b; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: #f0b90b; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #8fa0bd; line-height: 1.55; margin: 0 0 18px; font-size: .95rem; }
    a { display: inline-block; padding: 12px 20px; border-radius: 12px; background: #38bdf8; color: #04121f; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">N</div>
    <h1>You are offline</h1>
    <p>
      The wallet screen is cached, but balances, the live fee and transaction
      confirmation are read from the NSAT Mainnet node. Nothing is signed or
      shown as confirmed while there is no connection.
    </p>
    <a href="./wallet/">Open the cached wallet</a>
  </main>
</body>
</html>
